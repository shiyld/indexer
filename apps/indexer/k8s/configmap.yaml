# Example K8s manifests for self-hosting the Shiyld Indexer — mirrored out to the
# public @shiyld/indexer repo alongside docker-compose.yml (see CLAUDE.md's "Indexer:
# Full Design & Public Distribution Plan"). Unlike docker-compose.yml, Postgres is
# assumed EXTERNAL here (a managed database service, or one you already run in this
# cluster separately) — DATABASE_URL comes from secret.yaml.example, not a bundled
# StatefulSet. See k8s/README.md for the full apply order and setup notes.
#
# NOT build/deploy-tested yet — these manifests are believed correct against the
# real env vars in ../src/config.ts, but have not been applied to a real cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shiyld-indexer-config
data:
  INDEXER_HTTP_PORT: "4001"
  # Comma-separated network slugs from @shiyld/shared's NETWORKS registry — each
  # defaults to that registry's free public RPC unless overridden (see
  # secret.yaml.example's RPC_URL_<SLUG> entries).
  INDEXER_NETWORKS: "base-sepolia"
  # "public" serves every read endpoint to anyone; "restricted" requires one of
  # secret.yaml.example's INDEXER_API_KEYS on every request.
  INDEXER_ACCESS_MODE: "public"
  INDEXER_RATE_LIMIT_PER_MINUTE: "300"
