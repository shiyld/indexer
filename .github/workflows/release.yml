name: Release

# Stage 2 of the two-stage distribution pipeline: this repo receives mirrored commits
# from Shiyld's private monorepo on an ongoing basis (safe, no publish side effect).
# Publishing only ever happens here, and only when a real GitHub Release is cut on
# THIS repo — never automatically on a plain commit/push.
on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @shiyld/indexer-core run build

      - run: pnpm --filter @shiyld/indexer-core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Each architecture builds NATIVELY on its own runner, then a final job stitches the
  # two into one multi-arch tag. Emulating arm64 with QEMU on the amd64 runner (the
  # previous approach) crashed Node with "qemu: uncaught target signal 4 (Illegal
  # instruction)" during pnpm install and then hung until the 6-hour job limit — native
  # arm64 runners avoid emulation entirely (and build the blake-hash native addon for
  # real, not under emulation).
  build-docker:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: arch
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed by digest only (no tag yet) — the merge job below tags the combined image.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/indexer/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=shiyld/indexer,push-by-digest=true,name-canonical=true,push=true

      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.arch.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-docker:
    needs: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "shiyld/indexer:${GITHUB_REF_NAME}" \
            -t shiyld/indexer:latest \
            $(printf 'shiyld/indexer@sha256:%s ' *)

      - run: docker buildx imagetools inspect "shiyld/indexer:${GITHUB_REF_NAME}"
