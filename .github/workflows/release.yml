name: Release

# Stage 2 of the two-stage distribution pipeline: this repo receives mirrored commits
# from Shiyld's private monorepo on an ongoing basis (safe, no publish side effect).
# Publishing only ever happens here, and only when a real GitHub Release is cut on
# THIS repo — never automatically on a plain commit/push.
on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @shiyld/indexer-core run build

      - run: pnpm --filter @shiyld/indexer-core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Required for cross-platform builds — buildx alone can't natively execute
      # arm64 instructions on the amd64 GitHub-hosted runner; QEMU is what lets it
      # emulate arm64 to actually compile native addons (this image pulls in
      # blake-hash, a real C++ addon via node-gyp-build — the genuine risk this
      # multi-arch build had to be tested against for real, not just trusted from
      # the YAML, since QEMU-emulated native compilation is a real, sometimes-slow
      # or fragile path).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/indexer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            shiyld/indexer:${{ steps.meta.outputs.tag }}
            shiyld/indexer:latest
